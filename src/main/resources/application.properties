############################################################
# HALO Upload Configuration
############################################################

# 20 MB default chunk size
halo.upload.default-chunk-size=20971520

# Maximum allowed chunk size
halo.upload.max-chunk-size=104857600

# 20 GB max file size
halo.upload.max-file-size=21474836480

# Upload session lifetime
halo.upload.session-ttl=PT24H

# Cleanup interval
halo.upload.cleanup-interval=PT1H

# Verify chunk checksum
halo.upload.checksum-required=false

# Upload limits
halo.upload.max-active-sessions-per-user=5
halo.upload.max-reserved-bytes-per-user=53687091200
halo.upload.minimum-free-disk-bytes=5368709120

# Audit
halo.upload.audit-retention=180d

# Completed file retention
halo.upload.completed-file-retention=365d
halo.upload.deleted-file-grace-period=30d
halo.upload.automatic-completed-file-retention-enabled=false

# Recovery
halo.upload.recovery-initial-delay-ms=30000
halo.upload.recovery-interval-ms=300000

