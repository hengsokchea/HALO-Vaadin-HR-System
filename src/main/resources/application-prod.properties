vaadin.productionMode=true

#vaadin.frontend.url=/VAADIN/
#vaadin.frontend.build-url=/VAADIN/build/
vaadin.servlet.productionMode=true
vaadin.devtools.enabled=false
#vaadin.frontend.directory=frontend

# Use either root context (recommended)
#server.servlet.context-path=/
#vaadin.urlMapping=/*

# Or specific context path (choose one)
# server.servlet.context-path=/capital-inventory
# vaadin.urlMapping=/capital-inventory/*

# Remove this line as it's not needed:
# vaadin.webapp.resourcesDirectory=META-INF/VAADIN/webapp
spring.resources.static-locations=classpath:/META-INF/resources/,classpath:/static/,classpath:/public/,classpath:/resources/

app.upload.base-directory=${catalina.base:${user.dir}}/uploads


# ============================================
# JVM ARGUMENTS FOR PRODUCTION
# ============================================
# These should be set in your Tomcat/JVM startup
# but can also be added via Spring Boot properties
spring.jvm.args=--add-opens java.base/java.nio=ALL-UNNAMED \
    --add-opens java.base/sun.nio.ch=ALL-UNNAMED \
    --add-opens java.base/java.io=ALL-UNNAMED

# JasperReports Configuration
spring.jasperreports.enabled=true

app.thumbnail.video.enabled=true
app.thumbnail.video.ffmpeg-path=${catalina.base}/webapps/hr/ffmpeg/bin/ffmpeg.exe



